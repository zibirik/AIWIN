# JARVIS — конфигурация (копия в ai_core для удобства)
app:
  http_host: "127.0.0.1"
  http_port: 8000

grpc:
  address: "http://127.0.0.1:50051"

voice:
  enabled: true
  always_listen: true
  chunk_seconds: 6.0
  tail_seconds: 3.0
  command_extra_seconds: 3.0
  asr_model: "base"
  asr_load_timeout_sec: 900
  ack_tts: false
  greeting: "Слушаю. Говорите команду."
  wake_phrases:
    - "привет джарвис"
    - "привет, джарвис"
    - "джарвис"
    - "hello jarvis"
    - "jarvis"
