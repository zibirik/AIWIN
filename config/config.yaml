# JARVIS — конфигурация
app:
  http_host: "127.0.0.1"
  http_port: 8000

grpc:
  address: "http://127.0.0.1:50051"

voice:
  enabled: true
  always_listen: true
  # Дольше окно записи + VAD в Whisper — меньше обрезанных фраз и «галлюцинаций» на тишине
  chunk_seconds: 6.0
  tail_seconds: 3.0
  # Доп. секунды записи, если после wake команда короткая (договорить длинную фразу)
  command_extra_seconds: 3.0
  # base — меньше скачивание, быстрее старт; small — точнее для русского
  asr_model: "base"
  # Первый запуск качает модель с Hugging Face (может быть 5–15+ мин без токена)
  asr_load_timeout_sec: 900
  # false — не озвучивать «Выполняю» (микрофон не подхватывает колонки)
  ack_tts: false
  greeting: "Слушаю. Говорите команду."
  wake_phrases:
    - "привет джарвис"
    - "привет, джарвис"
    - "джарвис"
    - "hello jarvis"
    - "jarvis"
